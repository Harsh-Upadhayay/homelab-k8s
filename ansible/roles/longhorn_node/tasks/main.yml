---
# Worker-local storage policy for Longhorn. Terraform provisions the declared
# block device raw and empty; this role owns its filesystem, mount, and client
# prerequisites. It must never target a physical Proxmox host.

- name: Require an explicit Longhorn data device
  ansible.builtin.assert:
    that:
      - longhorn_data_device is defined
      - longhorn_data_device is match('^/dev/')
      - longhorn_data_label is defined
      - longhorn_data_label | length > 0
    fail_msg: "Set longhorn_data_device for every Longhorn worker."

- name: Format the Longhorn data device if it has no filesystem
  community.general.filesystem:
    fstype: ext4
    dev: "{{ longhorn_data_device }}"
    opts: "-L {{ longhorn_data_label }}"

- name: Mount the Longhorn data filesystem by label
  ansible.posix.mount:
    path: "{{ longhorn_mount_path }}"
    src: "LABEL={{ longhorn_data_label }}"
    fstype: ext4
    opts: defaults
    state: mounted

- name: Create the k3s agent systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s-agent.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Order k3s agent startup after its Longhorn filesystem
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-agent.service.d/10-longhorn-mount.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      RequiresMountsFor={{ longhorn_mount_path }}
  register: longhorn_k3s_mount_order

- name: Reload systemd after changing Longhorn mount ordering
  when: longhorn_k3s_mount_order.changed
  ansible.builtin.systemd:
    daemon_reload: true

- name: Install Longhorn node prerequisites
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
      - cryptsetup
      - dmsetup
    state: present
    update_cache: true

- name: Ensure the iSCSI daemon is enabled and running
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: true
