---
# These are the actual k3s prerequisites — not general hardening (that's a
# separate, later concern). Every task here exists because k3s specifically
# needs it to run correctly.

- name: Disable swap (Kubernetes requires swap off)
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap entries from /etc/fstab so it stays off after reboot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    line: '# \1'
    backrefs: true

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      br_netfilter
      overlay
    mode: "0644"

- name: Set required sysctl values for pod networking
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
    reload: true
  loop:
    - { name: "net.ipv4.ip_forward", value: "1" }
    - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }

# fs.inotify.max_user_instances defaults to 128 (unchanged upstream since
# 2005) and is a single pool shared by every process under one real UID.
# k3s/containerd run without user-namespace remapping, so kubelet itself
# (25-40+ instances just from watching mounted ConfigMap/Secret volumes)
# and every pod's root process all draw from the same 128-slot pool on a
# given node. Once it's empty, the next inotify_init() anywhere on that
# node fails with EMFILE, surfaced by most libraries as a generic, misleading
# "too many open files" that never mentions inotify. fs.inotify.max_user_watches
# is deliberately left alone here — it already auto-scales with RAM as of
# kernel 5.11 and was already comfortably above default on every node.
- name: Raise fs.inotify.max_user_instances (128 default is shared and exhausted across all pods + kubelet on a node)
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: "12400"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
    reload: true

- name: Ensure qemu-guest-agent is running (baked into the template, just confirming)
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
    enabled: true

- name: Set a consistent hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the k3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

# Point containerd at the in-cluster dev registry (ADR-0059, issue #65).
#
# TWO SEPARATE PROBLEMS ARE SOLVED HERE, and conflating them is what makes the
# obvious version of this file wrong.
#
# 1. HTTPS. Containerd assumes HTTPS and validates certificates for every registry.
#    This one is node-local plain HTTP with no certificate, so without the http://
#    scheme on the endpoint every pull fails with
#    "http: server gave HTTP response to HTTPS client". No `configs` block is
#    needed — that section carries auth and TLS settings, and there is neither.
#
# 2. DNS. The thing pulling images is containerd, running on the NODE. Nodes sit
#    outside the cluster network and use their own resolver, so they CANNOT resolve
#    any *.svc.cluster.local name — that is CoreDNS's job and CoreDNS only serves
#    pods. Pointing the endpoint at registry.workbench.svc.cluster.local fails with
#    "no such host". This is k3s issue #1581, open since March 2020 with no upstream
#    fix; the workaround in that thread (adding CoreDNS's IP to the node's
#    /etc/resolv.conf) makes every node's DNS depend on a pod that needs DNS to
#    schedule, and is rejected here for that reason.
#
# THE KEY IS A PATTERN, NOT A HOSTNAME. This is what resolves the tension, and it
# is what kind, k3d and minikube all converged on: the quoted `mirrors` key is
# matched as a literal string against the image reference and is NEVER resolved.
# Only `endpoint` is dialed. So manifests keep the readable service name while
# containerd talks to a node-local address.
#
# 127.0.0.1:30500 is the registry Service's pinned nodePort. Chosen over hardcoding
# the ClusterIP, which is stable only until the Service is deleted and recreated —
# at which point every node's copy of this file silently goes stale.
#
# Mode 0644, unlike config.yaml next to it: that file holds the cluster join token,
# this one has no secrets and containerd reads it as root regardless.
#
# Scope is DEV ONLY (ADR-0060) — this registry must never serve images Argo CD
# deploys, since an in-cluster build path under GitOps produces artifacts that are
# not reproducible from git.
- name: Point containerd at the in-cluster dev registry
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0644"
    content: |
      mirrors:
        "registry.workbench.svc.cluster.local":
          endpoint:
            - "http://127.0.0.1:30500"
  notify: restart k3s node runtime
