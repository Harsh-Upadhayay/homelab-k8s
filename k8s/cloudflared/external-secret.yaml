# Cloudflare Tunnel token — the connector's auth to Cloudflare's edge. ESO
# materializes this from SSM as the `cloudflared-tunnel-token` Secret; the
# Deployment references it via secretKeyRef (key: token) for TUNNEL_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel-token
  namespace: cloudflare
spec:
  refreshInterval: "0" # manual refresh only — annotate to force re-sync
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: cloudflared-tunnel-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: /neovara/homeinfra/cloudflared/tunnel-token
