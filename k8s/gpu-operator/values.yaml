# NVIDIA GPU Operator values (ADR-0067).
#
# The operator is deliberately reduced to its Kubernetes-facing job. The two
# node-level pieces it would normally own — the driver and the container
# toolkit — are installed on the node by the nvidia_gpu_node Ansible role
# instead, for three reasons:
#
#   1. Ubuntu 26.04 is new enough that NVIDIA's driver *container* images lag
#      it. A generic driver container would compile kernel modules against
#      7.0.0-29-generic unattended, in a privileged pod, on a hypervisor that
#      now has no console at all (its only GPU is the one passed through).
#   2. Ubuntu's packaged driver is built for exactly this kernel, pins per
#      ADR-0002, and — decisively — can be proven working with nvidia-smi
#      BEFORE anything in Kubernetes depends on it.
#   3. k3s auto-detects nvidia-container-runtime at startup and writes the
#      containerd runtime itself. Letting the operator's toolkit do it instead
#      would mean overriding CONTAINERD_CONFIG/CONTAINERD_SOCKET to k3s's
#      non-standard paths to duplicate work k3s already does natively.
#
# What the operator still provides, and why it was chosen over a bare device
# plugin: the device plugin itself, DCGM/Prometheus metrics, node feature
# discovery, and the validator.
driver:
  enabled: false
toolkit:
  enabled: false

operator:
  # k3s ships a predefined `nvidia` RuntimeClass and, once the toolkit is
  # present, registers a matching containerd runtime handler. The operator's
  # GPU-touching pods opt into it per-pod through this.
  #
  # This is the chart default, set explicitly because it is load-bearing here:
  # the node's DEFAULT runtime stays runc on purpose. k3s-worker-3 also runs
  # Argo CD, cert-manager, cloudflared, Longhorn CSI and Immich ML, and
  # switching the container runtime under all of them to benefit a handful of
  # pods is a far wider blast radius than this needs.
  runtimeClass: nvidia

# Node Feature Discovery labels nodes with the PCI vendors present on them,
# which is how the device plugin and DCGM exporter land only on the node that
# actually holds the card instead of every node in the cluster.
nfd:
  enabled: true

devicePlugin:
  # TIME-SLICING: one physical card, more than one consumer.
  #
  # By default `nvidia.com/gpu` is an exclusive resource — the first pod to
  # request it owns the card and every other request stays Pending forever.
  # Immich needs two consumers at once (ADR-0069): immich-server for NVENC
  # transcoding and immich-machine-learning for CUDA inference. Time-slicing
  # makes the plugin advertise `replicas` schedulable units of the same physical
  # GPU, and the driver round-robins kernels between them.
  #
  # WHAT THIS DOES NOT DO: it does not partition VRAM. Every sharer sees the
  # whole 6 GiB and they can starve each other — this is cooperative sharing,
  # not isolation (MIG would isolate, but Turing does not support MIG). The
  # workloads here fit comfortably: Immich's CLIP and facial-recognition models
  # are ~1-2 GiB and NVENC sessions are a few hundred MiB, since NVENC is a
  # dedicated encoder block rather than a CUDA consumer.
  #
  # 4 replicas rather than exactly 2: it leaves room for the validation Job and
  # one future consumer (ollama is on the migration checklist) without
  # pretending 6 GiB is unlimited. Raising this number never adds capacity — it
  # only adds contention.
  config:
    create: true
    name: device-plugin-config
    default: shared
    data:
      shared: |-
        version: v1
        flags:
          migStrategy: none
        sharing:
          timeSlicing:
            resources:
              - name: nvidia.com/gpu
                replicas: 4

# DCGM metrics are one of the reasons the operator was chosen over a bare
# device plugin. Prometheus here discovers ServiceMonitors cluster-wide
# (ADR-0039), so turning this on is all the wiring required.
dcgmExporter:
  enabled: true
  serviceMonitor:
    enabled: true
