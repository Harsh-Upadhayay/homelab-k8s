# Cloudflare API token — consumed by both ClusterIssuers (letsencrypt-staging and
# letsencrypt-prod) for DNS-01 challenges. ESO materializes this from SSM as the
# `cloudflare-api-token` Secret; cert-manager references it by that name + key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  annotations:
    # Before the wave-1 ClusterIssuers that consume this Secret — on a green-field
    # rebuild the Secret must exist before an Issuer can validate against it.
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: "0" # manual refresh only — annotate to force re-sync
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: /neovara/homeinfra/cert-manager/cloudflare-api-token
