apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: nextcloud
  name: nextcloud-db # ExternalSecret name; conventionally matches the Secret it creates (target.name below)
spec: 
  # No periodic re-pull from SSM — manual refresh only, to keep AWS API calls
  # deliberate. Force a re-sync after rotating a value in AWS by annotating:
  #   kubectl annotate externalsecret nextcloud-db -n nextcloud --overwrite refreshed-at="$(date -Iseconds)"
  refreshInterval: "0" # string — ESO's CRD types refreshInterval as a duration string, not an int
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: "nextcloud-db"
    creationPolicy: Owner
  data: 
    - secretKey: POSTGRES_PASSWORD 
      remoteRef:
        key: /neovara/homeinfra/nextcloud/db-password
    - secretKey: db-username   
      remoteRef:
        key: /neovara/homeinfra/nextcloud/db-username