# Two secrets the relay needs, both from SSM via ESO:
#
#   photos-relay-immich  — the Immich API key the relay authenticates with. This
#     is a user-provided runtime secret (create it in Immich: Account -> API Keys,
#     with asset read + download permission) stored at the SSM path below.
#
#   photos-relay-adb — the adb RSA keypair whose public half the handset already
#     authorized ("Always allow" was tapped once). Reusing this exact identity is
#     what keeps the relay hands-off: a freshly generated key would re-trigger the
#     on-device authorization prompt, which nothing can tap unattended.
#
# refreshInterval "0" matches the repo convention: manual refresh only; annotate
# the ExternalSecret to force a re-sync after rotating a value in SSM.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: photos-relay-immich
  namespace: photos-relay
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: photos-relay-immich
    creationPolicy: Owner
  data:
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: /neovara/homeinfra/photos-relay/immich-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: photos-relay-adb
  namespace: photos-relay
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: photos-relay-adb
    creationPolicy: Owner
  data:
    - secretKey: adbkey
      remoteRef:
        key: /neovara/homeinfra/photos-relay/adbkey
    - secretKey: adbkey.pub
      remoteRef:
        key: /neovara/homeinfra/photos-relay/adbkey-pub
