# Read-only status page for the relay. A plain ClusterIP fronted by an
# IngressRoute on the internal `*.in.neovara.uk` front door (ingressroute.yaml) —
# reachable from tailnet devices at https://photos-relay.in.neovara.uk, served
# with the wildcard cert. This reuses the single `traefik-internal` Tailscale
# device instead of minting a per-service one via loadBalancerClass: tailscale
# (which also spared the stuck-finalizer cleanup: the operator's OAuth client
# cannot delete devices, so a per-service LB Service hangs in Terminating).
#
# The page carries no auth of its own by design: reaching it already requires
# being on the tailnet, and it is strictly read-only (renders progress; it cannot
# touch adb or the phone). Port 80 → the relay's :8080 status thread.
apiVersion: v1
kind: Service
metadata:
  name: photos-relay-status
  namespace: photos-relay
  labels:
    app.kubernetes.io/name: photos-relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: photos-relay
  ports:
    - name: status
      port: 80
      targetPort: status   # named port on the relay pod → 8080
