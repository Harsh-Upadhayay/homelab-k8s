# Official immich-app community chart 0.13.1 defaults to Immich v3.0.0. Pin
# both the server and CPU-only ML images to the targeted v3.0.3 patch release.
# The required v2.7.3 VectorChord migration completed before this image bump.
#
# The workstation rebuild recovery completed on 2026-07-24 JST. The library
# PVC is retained independently of this chart and uses the current one-copy
# Longhorn policy; application components remain enabled in Git.
controllers:
  main:
    containers:
      main:
        image:
          tag: v3.0.3

immich:
  metrics:
    enabled: false # Prometheus Operator is intentionally stopped by the operator.
  persistence:
    # The chart requires an independently-created library PVC.
    library:
      existingClaim: immich-library

server:
  enabled: true
  controllers:
    main:
      # One server writes one RWO library. Recreate guarantees no overlapping
      # writers and avoids a RollingUpdate Multi-Attach race.
      strategy: Recreate
      containers:
        main:
          env:
            DB_HOSTNAME: immich-postgres
            DB_PORT: "5432"
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: DB_USERNAME
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: DB_PASSWORD
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: DB_DATABASE_NAME
            TZ: Asia/Tokyo
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 8Gi
          # Immich v3 runs the API and the CPU-bound video-transcoding worker in
          # ONE process. While a batch of clips transcodes (GPU/CUDA is absent on
          # this node, so ffmpeg falls back to CPU), the /api/server/ping health
          # endpoint can miss the chart-default liveness timeout of 1s — kubelet
          # then SIGTERMs a server that is actually healthy, just busy, throwing
          # away in-flight transcode work and crash-looping (incident 2026-09-02).
          # Override the chart's probes so liveness restarts only a genuinely
          # HUNG process, not a busy one: 10s timeout, 5 misses (50s) before kill.
          # Named port `http` matches the chart's container port (== 2283).
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: http
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 5
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: http
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: http
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 30
  persistence:
    # Chart 0.13.1 mounts the claim at the upstream-standard /data. Every
    # restored asset row still stores the historical /usr/src/app/upload prefix,
    # so mount the SAME claim at that legacy path. The v3.0.3 acceptance check
    # must pass before a separate path-normalization change can remove it.
    legacy-library:
      existingClaim: immich-library
      globalMounts:
        - path: /usr/src/app/upload

machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 12Gi
  # CPU-only image; model cache is intentionally ephemeral for this transition.
  persistence:
    cache:
      enabled: true
      type: emptyDir

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
  persistence:
    data:
      enabled: true
      type: emptyDir
