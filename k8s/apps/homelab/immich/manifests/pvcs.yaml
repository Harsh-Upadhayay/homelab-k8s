# Existing migrated claims. Argo adopts their metadata and identical immutable
# specs; it must never recreate them. Both backing PVs use reclaimPolicy Retain.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-immich-hdd-retain
  resources:
    requests:
      # Raised 350Gi -> 450Gi on 2026-09-09. The library had reached 335G of
      # 344G usable (98%, ~9.2G left) and was firing a critical
      # KubePersistentVolumeFillingUp that nobody could see, because
      # Alertmanager discards every alert (#92). INC-2026-009 is what a full
      # Longhorn volume does to the workload on top of it, so this is expanded
      # well before it gets there rather than after.
      #
      # Capacity check before raising: worker-3's longhorn-hdd disk has 874Gi
      # actually free of 1278Gi, and 472Gi scheduled against 1268Gi schedulable
      # (storage-over-provisioning-percentage 100, 10Gi reserved), so +100Gi of
      # provisioned size is comfortably within both real and scheduled space.
      storage: 450Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres
  namespace: immich
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/part-of: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-immich-db-retain
  resources:
    requests:
      storage: 10Gi
