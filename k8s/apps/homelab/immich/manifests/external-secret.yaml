# Immich DB credentials — same shape as nextcloud-db. ESO materializes this from
# SSM as the `immich-db` Secret; both the immich server (chart) and the postgres
# Deployment (postgres.yaml) reference it by that name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db
  namespace: immich
spec:
  refreshInterval: "0" # manual refresh only — annotate to force re-sync
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: immich-db
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /neovara/homeinfra/immich/db-password
    - secretKey: DB_USERNAME
      remoteRef:
        key: /neovara/homeinfra/immich/db-username
    - secretKey: DB_DATABASE_NAME
      remoteRef:
        key: /neovara/homeinfra/immich/db-database-name
