# Preserve upstream's four independent mount boundaries. In particular,
# /config contains the SQLite database and must stay on an RWO block filesystem
# (never RWX/NFS/SMB). The legacy `longhorn-replicated` class name is immutable
# on bound PVCs, but the current cluster-wide default is one data copy. Selected
# volumes can be promoted to two copies manually after this migration.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-config
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-metadata
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # A new name is required because a bound PVC's storageClassName is immutable.
  name: audiobookshelf-audiobooks-single
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 70Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-podcasts
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 5Gi
