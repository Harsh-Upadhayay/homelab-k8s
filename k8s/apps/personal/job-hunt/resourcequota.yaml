# Aggregate resource ceiling for the whole job-hunt namespace — the "how much"
# fence (alongside RBAC "who" and the AppProject "what/where"). Bounds a runaway
# dev app so it can't starve homelab workloads on a never-overcommitted cluster
# (ADR-0020).
#
# Sized 2026-08-21 from the app's actual 7-workload footprint (django, 3x
# celery, mysql, redis, frontend), not the kiroku-derived 2-container default
# this file started from. Steady-state usage across all 7 pods is
# requests.cpu~900m / requests.memory~1024Mi / limits.cpu~1.9 / limits.memory
# ~2.25Gi — the ORIGINAL 1Gi requests.memory cap left zero headroom, which is
# why `frontend` could never get a single pod scheduled, and why a RollingUpdate
# on any other pod deadlocked (old pod's quota usage blocked the new pod
# replacing it, so the old one could never be evicted either). These values
# give steady-state usage roughly 2x headroom for a full-fleet rollout surge.
#
# NOTE: once this quota constrains a compute resource, EVERY pod in the namespace
# must declare requests+limits or it's rejected — the paired limitrange.yaml
# supplies defaults so bare pods still admit. (See Kubernetes Concepts.md,
# "Resource governance: ResourceQuota and LimitRange".)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: job-hunt-quota
  namespace: job-hunt
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2.5Gi
    limits.cpu: "4"
    limits.memory: 5Gi
    pods: "20" # 7 workloads x2 during a full-fleet rollout surge, plus margin
    services: "10"
    persistentvolumeclaims: "4"
    # Raised 10Gi -> 64Gi on 2026-09-08 after the mysql PVC filled to 100%
    # (7.8G of 8Gi). MySQL keeps 30 days of binary logs (binlog_expire_logs_seconds
    # 2592000) at ~1GB/day while the actual jobhunt_db is only 1.4GB, so the volume
    # filled with 6.1GB of binlogs. A full data volume made every InnoDB write hang
    # in "waiting for handler commit", those connections never released, MySQL hit
    # max_connections=151, and django CrashLooped on ERROR 1040 "Too many
    # connections" — which is what broke login. 64Gi = mysql 58Gi + redis 1Gi plus
    # margin for a 4th PVC. Worker-1's Longhorn disk has ~568Gi free (ADR-0021).
    # NOTE: this only buys headroom — binlog retention is the actual fix and is
    # tracked separately in the app repo (deep-astaad/job-hunt).
    requests.storage: 64Gi
