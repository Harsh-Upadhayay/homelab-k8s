# Tailscale auth key for the devbox — used ONLY for the one-time initial
# `tailscale up` or a state-wipe recovery (see ADR-0064 + the Workbench Runbook
# troubleshooting section). Normal restarts resume from tailscaled.state on the
# PVC, no auth key involved.
#
# Unlike every other ExternalSecret here, the devbox does NOT mount this as a
# volume or env var. It reads the Secret via the Kubernetes API from inside the
# pod (namespace-admin RBAC, ADR-0065) at recovery time. ESO materializing the
# Secret under the same name/key is transparent to that `kubectl get` consumer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-auth
  namespace: workbench
spec:
  refreshInterval: "0" # manual refresh only — annotate to force re-sync
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: tailscale-auth
    creationPolicy: Owner
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: /neovara/homeinfra/workbench/tailscale-authkey
