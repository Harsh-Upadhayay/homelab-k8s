# The devbox — the developer's shell and editor backend, plus the workspace volume
# every other workbench pod mounts (ADR-0054, ADR-0055, ADR-0064).
#
# tailscaled runs IN THIS CONTAINER rather than a sidecar: Tailscale SSH spawns the
# login shell as a child of tailscaled, in tailscaled's own container filesystem, so
# a sidecar would drop you into the official Alpine image — no workspace, and no
# glibc for VS Code Remote-SSH's server. See the ADR-0064 amendment.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspace
  namespace: workbench
  labels:
    app.kubernetes.io/name: workbench
  annotations:
    # Orders objects WITHIN this Application only — it does not sequence against the
    # `longhorn` Application that ships the StorageClass. Sync longhorn first.
    argocd.argoproj.io/sync-wave: "0"
spec:
  # node-scoped, not pod scoped, i.e one node may mount the volumen & any number of
  # pods on that node can mount it simultaneously — which is exactly what lets the
  # devbox and every project's app containers share this one volume (ADR-0054).
  # `ReadWriteOncePod` is the genuinely pod-exclusive mode and would break that.
  # RWO also pins all workbench pods to one node for free; under the class's
  # dataLocality: best-effort the replica follows them there.
  accessModes: [ReadWriteOnce]

  # MUST be explicit. Omitting it binds to the cluster DEFAULT class, which here is
  # local-path (see k8s/longhorn/values.yaml) — a node-local directory that works
  # right up until the pod moves. Chosen for dataLocality: best-effort; see
  # storageclass-workbench.yaml for why neither existing Longhorn class fits.
  #
  # NOTE: this class uses volumeBindingMode: WaitForFirstConsumer, so this PVC stays
  # Pending until a pod mounts it. That is correct, not broken — every other PVC in
  # this repo uses Immediate and binds straight away.
  storageClassName: longhorn-workbench

  resources:
    requests:
      # No limits for storage, direct ask i want this much.
      # Floor from #59: 14 repos plus every node_modules/.venv/GOMODCACHE. The class
      # sets allowVolumeExpansion: true, so starting small is cheap to correct —
      # growing means editing this value and re-syncing.
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbox
  namespace: workbench
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: devbox
  replicas: 1
  # Recreate, not the default RollingUpdate (2026-10-02). RollingUpdate starts the
  # new pod BEFORE stopping the old one, which deadlocks here:
  #   - the old pod holds hostPort 41642 on its node, so the scheduler must put
  #     the new pod on a DIFFERENT node;
  #   - the workspace PVC is RWO, so it can only attach where it already is.
  # Observed on the first restart after #100: new pod on k3s-worker-3 stuck in
  # ContainerCreating (Multi-Attach error) while the old one waited for it.
  # Recreate stops the old pod first. It costs nothing real, since a single-
  # replica devbox has a gap on every restart anyway, and the old pod was only
  # a dead terminal session by then.
  #
  # KNOWN GAP, not fixed here: nothing makes the scheduler put the devbox on the
  # node where the volume is attached. The other workspace pods (kiroku,
  # neovara-homepage, ...) keep it attached wherever they run, and if the
  # devbox lands on another node it sticks in Multi-Attach until deleted. Fixing
  # that needs a label shared by every workspace pod for podAffinity to match.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devbox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: devbox
        # Built in-cluster from k8s/workbench/devbox-image/Dockerfile (issue #65).
        #
        # imagePullPolicy: Always because `dev` is a MUTABLE tag. Without it a node
        # that already has a `:dev` layer keeps running the old image after a
        # rebuild — observed during M6 verification, where a fresh pod silently ran
        # the previous build. The registry is node-local (127.0.0.1:30500 via
        # registries.yaml), so re-pulling costs almost nothing.
        image: registry.workbench.svc.cluster.local/devbox:dev
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        # Direct tailnet path (devbox lag investigation, 2026-09-25 / 2026-10-02).
        #
        # THE PROBLEM: flannel SNATs pod egress with `MASQUERADE --random-fully`,
        # which picks a fresh source port for EVERY destination. Tailscale calls that
        # "hard NAT" (netcheck inside the pod: MappingVariesByDestIP: true) — the
        # public ip:port it learns from one STUN server is not the one any peer will
        # see, so hole punching never succeeds and every packet went via DERP Tokyo.
        # The k3s VMs behind the same home NAT go direct; only the pod failed.
        #
        # THE FIX lives on the node, not here: Ansible installs, on every k3s worker,
        # a nat POSTROUTING rule ahead of flannel's that SNATs exactly this
        # source port WITHOUT --random-fully. Plain MASQUERADE keeps the source
        # port when it is free, so every destination sees the same ip:port — the
        # same "easy NAT" the VMs have.
        #
        # --port pins tailscaled's UDP port so that rule has something to match.
        # 41642, NOT the default 41641: the node's own tailscaled already holds
        # 41641 on the node IP, so MASQUERADE could not keep that port and would
        # fall back to picking one per flow — hard NAT again.
        #
        # THE SECOND HALF is the hostPort below (2026-10-02). The SNAT rule alone
        # only works if the pod's packet to a peer leaves FIRST. When the peer's
        # packet arrives first — the normal case, since peers probe the advertised
        # node:41642 constantly — nothing listens there, the kernel still records
        # it as a node-local flow, and that record occupies the tuple
        # node:41642 <-> peer. The pod's own reply then cannot use 41642, MASQUERADE
        # picks another port, and the two sides never meet (observed live: pod
        # flow to the Mac rewritten to :46669, 0/20 direct). hostPort makes the
        # CNI portmap plugin DNAT inbound node:41642 to this pod, so the peer's
        # packet IS the pod's flow instead of blocking it. Verified with the
        # equivalent hand-written DNAT rule: 30/30 direct, p50 260ms.
        args:
          - |
            setsid /usr/local/bin/tailscaled \
              --tun=userspace-networking \
              --port=41642 \
              --statedir=/home/vscode/.local/share/tailscale \
              --socket=/tmp/ts.sock </dev/null >/tmp/tsd.log 2>&1 &
            exec sleep infinity
        # hostPort is safe here despite registry.yaml rejecting it: that objection
        # is about reaching a hostPort via 127.0.0.1 from the node itself, which
        # portmap does not handle. This traffic arrives on the node's LAN IP from
        # outside, which it does (k3s's flannel conflist includes portmap). Only
        # WireGuard listens on it, and tailscaled drops anything not from a tailnet
        # node key. Side effect: one devbox per node — already true (replicas: 1).
        ports:
          - name: tailscale
            containerPort: 41642
            hostPort: 41642
            protocol: UDP
        # Why requests, and deliberately NO limits (devbox lag investigation, 2026-09-08).
        #
        # With no resources block at all the kubelet classified this pod BestEffort and
        # implemented that as cpu.weight=1 — the floor — nested inside a besteffort.slice
        # also at weight 1, competing with burstable.slice at 224. cpu.weight is not a cap;
        # it only arbitrates when the run queue is deep, which is why `kubectl top` showed a
        # comfortable 58% node average and hid this completely. Measured during a burst:
        # 59-82 runnable tasks on 14 vCPUs, and this pod's own cgroup reporting
        # cpu.pressure full avg60=12.77 — frozen, doing zero work, 13% of wall-clock time.
        # Same CPU benchmark, same node, same instant: 21.1M iterations as an ordinary host
        # process vs 4.3M inside this pod.
        #
        # requests.cpu IS the fix — it is the only thing that sets cpu.weight.
        #
        # No limits.cpu on purpose: that sets cpu.max (CFS quota), which throttles in every
        # 100ms window even when the node is idle, reintroducing the exact stutter this
        # block exists to remove.
        #
        # No limits.memory on purpose either — it contributes NOTHING to OOM ranking.
        # Verified here: ais-celery-low (limit 2Gi) and ais-celery-high (limit 10Gi) both
        # sit at oom_score_adj=991 because they share a 256Mi *request*. The kubelet reads
        # only the request:  oom_score_adj = 1000 - 1000 * (request / node capacity).
        # The 8Gi request below moves this pod off 1000 (BestEffort — killed first) to ~700,
        # and kubelet eviction ranks by usage ABOVE request, so a limit would buy no
        # protection and only add a ceiling that kills live Claude sessions while the node
        # still has free RAM.
        resources:
          requests:
            cpu: "2"       # more weight than the entire 15-pod celery fleet combined
            memory: 8Gi    # measured RSS 4.4Gi: 5 Claude sessions + the VS Code server
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: workspace
            mountPath: /home/vscode
            subPath: home
        livenessProbe:
          exec:
            command:
              # Baked into the image now, not $HOME — the PVC mount below would
              # shadow anything under /home/vscode. --statedir above deliberately
              # stays on the PVC: the binary is software, the node identity is state.
              - /usr/local/bin/tailscale
              - --socket=/tmp/ts.sock
              - status
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      serviceAccountName: devbox
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace
