apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbox
  namespace: workbench
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: devbox
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devbox
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: devbox
        image: mcr.microsoft.com/devcontainers/base:bookworm
        command: ["sleep", "infinity"]
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: workspace
            mountPath: /home/vscode
            subPath: home
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: workspace