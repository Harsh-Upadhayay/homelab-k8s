# In-cluster image registry for the dev inner loop (ADR-0059, issue #65).
#
# WHY A REGISTRY IS MANDATORY, not a convenience: a Deployment cannot reference an
# image sitting on a PVC. `image:` is not a filesystem path — containerd resolves
# images exclusively from its own per-node content store, which is populated only by
# pulling from a registry. A built image on the workspace volume is invisible to the
# kubelet no matter how the manifest is written.
#
# SCOPE IS DEV ONLY (ADR-0060). This registry must never serve images that Argo CD
# deploys: an in-cluster build path under GitOps produces artifacts that are not
# reproducible from git, which is the thing GitOps exists to prevent. Real images
# come from CI (issue #27).
#
# Lives in `workbench` rather than its own namespace, so the flat-namespace argument
# from ADR-0054 holds and the devbox's existing namespace-admin RoleBinding
# (ADR-0065) already covers it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
  namespace: workbench
  labels:
    app.kubernetes.io/name: registry
spec:
  accessModes: [ReadWriteOnce]

  # Plain `longhorn`, NOT `longhorn-workbench`. That class exists for
  # dataLocality: best-effort, which keeps the workspace's small-file I/O local to
  # the pod — the right call for `git status` and language-server indexing. A
  # registry serves large sequential blobs a handful of times a year, so locality
  # buys nothing here, and best-effort would trigger a background full-volume
  # rebuild every time this pod moved nodes.
  storageClassName: longhorn

  resources:
    requests:
      # Separate from the workspace volume on purpose: registry data is
      # infrastructure state, not the operator's code. Nuking the workspace must not
      # take the images with it.
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: workbench
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      # NOTE: deliberately no securityContext, unlike the devbox. The registry:2
      # image runs as its own user and expects to own /var/lib/registry; forcing
      # runAsUser: 1000 here breaks it on permissions. securityContext is a
      # per-workload decision, not a blanket policy.
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
              name: registry
          volumeMounts:
            # This path is the registry:2 image's contract for where blobs live —
            # not a free choice.
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: workbench
spec:
  # NodePort, not ClusterIP — and the reason is worth keeping, because the obvious
  # design does not work.
  #
  # THE PROBLEM: the thing that pulls images is containerd, running on the NODE.
  # Nodes are outside the cluster network and use their own resolver, so they cannot
  # resolve any *.svc.cluster.local name — that is CoreDNS's job and CoreDNS only
  # serves pods. A registries.yaml endpoint of registry.workbench.svc.cluster.local
  # fails with "no such host". This is k3s issue #1581, open since March 2020 with
  # no upstream fix; the workaround in that thread (adding CoreDNS's IP to the
  # node's /etc/resolv.conf) makes every node's DNS depend on a pod that needs DNS
  # to schedule, and is rejected here for that reason.
  #
  # THE RESOLUTION, which is what kind, k3d and minikube all converged on: the
  # `mirrors` key in registries.yaml is a MATCHING PATTERN, not a hostname. It is
  # compared as a literal string against the image reference and is never resolved.
  # Only `endpoint` is ever dialed. So manifests keep the readable service name
  # while containerd is pointed at a node-local address.
  #
  # NodePort over hardcoding the ClusterIP: a ClusterIP is stable only until the
  # Service is deleted and recreated, at which point every node's registries.yaml
  # silently goes stale. 127.0.0.1:30500 has no such failure mode. hostPort was
  # rejected outright — it is known-broken with CNI plugins (kubernetes #44564).
  #
  # This does not contradict ADR-0059's "ClusterIP only", which was written to mean
  # "not exposed to the LAN". A NodePort bound for node-local containerd use is a
  # narrower thing than what that was guarding against, and pods still reach the
  # registry by its ClusterIP exactly as before.
  type: NodePort
  selector:
    app.kubernetes.io/name: registry
  ports:
    # port 80 so in-cluster references need no port suffix:
    #   registry.workbench.svc.cluster.local/<repo>:dev
    # `port` is what the Service listens on, `targetPort` the container's actual
    # 5000, and `nodePort` the fixed port containerd dials on 127.0.0.1. The
    # nodePort is pinned rather than auto-assigned precisely because Ansible writes
    # it into registries.yaml on every node.
    - port: 80
      targetPort: 5000
      nodePort: 30500
