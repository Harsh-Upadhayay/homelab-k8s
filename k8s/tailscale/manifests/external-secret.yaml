# Tailscale operator OAuth client — the chart mounts the `operator-oauth` Secret
# by name (oauth.* is omitted from values.yaml, so the chart templates no Secret
# of its own). ESO materializes this from SSM. The operator caches its auth
# state SEPARATELY in the `operator` Secret (machine identity, certs), which ESO
# does NOT touch.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: "0" # manual refresh only — annotate to force re-sync
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_secret
      remoteRef:
        key: /neovara/homeinfra/tailscale/client-secret
    - secretKey: client_id
      remoteRef:
        key: /neovara/homeinfra/tailscale/client-id
