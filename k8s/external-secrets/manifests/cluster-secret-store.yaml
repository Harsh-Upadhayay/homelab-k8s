# ClusterSecretStore: how ESO reaches AWS SSM Parameter Store. Cluster-scoped so
# any namespace *could* reference it, but `conditions` below gates consumption to
# namespaces labeled neovara-external-secrets=true (opt-in per app).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      # ESO does sts:AssumeRole before reading — the access key alone is useless
      # (Decision E). The role holds the ssm/kms permissions.
      role: arn:aws:iam::276562183996:role/neovara-k8s-eso-ssm
      auth:
        secretRef:
          # namespace: is REQUIRED here — a ClusterSecretStore is cluster-scoped,
          # so ESO can't infer which namespace the bootstrap Secret lives in.
          accessKeyIDSecretRef:
            name: aws-creds
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-creds
            namespace: external-secrets
            key: access-key-secret
  conditions:
    - namespaceSelector:
        matchLabels:
          neovara-external-secrets: "true"
