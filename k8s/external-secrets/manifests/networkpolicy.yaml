apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: external-secrets-restrict-egress
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets # standard Helm label; selects all 3 ESO pods
  policyTypes:
    - Egress
  egress:
    # DNS — resolve the apiserver Service + the AWS FQDNs (kube-DNS can run anywhere)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # kube-apiserver. Enforcement is post-DNAT (see cloudflared/networkpolicy.yaml),
    # so the policy sees the backend IP:port — the control-plane node on 6443,
    # NOT the Service's 10.43.0.1:443. Update this CIDR if the control plane moves.
    - to:
        - ipBlock:
            cidr: 192.168.1.21/32
      ports:
        - protocol: TCP
          port: 6443
    # AWS endpoints (SSM/KMS/STS) over HTTPS. No FQDN policy on Flannel, so allow
    # any destination on 443 — same shape as cloudflared's external rule.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
