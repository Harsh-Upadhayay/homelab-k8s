# Child Application: Longhorn — chart + companions bundled. The companions
# (k8s/longhorn/manifests/) are: the legacy-name `longhorn-replicated`
# StorageClass (ADR-0030, retained because a bound PVC's storageClassName is
# immutable), the Immich retain classes (ADR-0052), the internal-only UI
# IngressRoute (ADR-0033), the Grafana dashboard ConfigMap (ADR-0041), and the
# `longhorn-workbench` class for the v4.0 developer workspace (ADR-0055
# amendment, issue #59). The original three already existed in-cluster from the
# manual Longhorn install — first sync adopted them (tracking-annotation-only
# diff), same as the Traefik chart adoption was.
#
# The whole directory is a source path, so a new manifest here needs no change
# to this file. Note there is no syncPolicy.automated: this Application syncs
# manually.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.12.0 # matches the version live since the storage phase
      helm:
        valueFiles:
          - $values/k8s/longhorn/values.yaml
    - repoURL: https://github.com/Harsh-Upadhayay/homelab-k8s.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Harsh-Upadhayay/homelab-k8s.git
      targetRevision: main
      path: k8s/longhorn/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
