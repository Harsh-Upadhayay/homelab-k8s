# Child Application: external-secrets — the operator that syncs AWS SSM
# Parameter Store values into Kubernetes Secrets (Phase 4 of the ESO+SSM
# rollout, #17).
#
# Brand-new operator, nothing live to adopt -> automated sync from day one
# (the Argo Rollouts precedent, ADR-0045), unlike cert-manager/longhorn which
# were manual-first adoptions of pre-existing releases.
#
# Standard chart+companions shape (3 sources): the upstream ESO chart pinned
# per ADR-0002, a $values ref so the chart can read its values file from git,
# and this repo's k8s/external-secrets/manifests/ for the ClusterSecretStore +
# NetworkPolicy companions (added in 4b). CRDs are chart-managed
# (installCRDs: true in values.yaml) — same choice as cert-manager, not the
# kube-prometheus-stack skipCrds path.
#
# The one hardening knob that matters here is set in values.yaml:
# rbac.serviceAccountTokenCreate=false. We authenticate to AWS with a static
# access key (Decision E), not serviceAccountRef, so ESO has no business
# minting ServiceAccount tokens — removing that permission closes an
# impersonation escalation path.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.8.0 # pinned per ADR-0002 (appVersion v2.8.0)
      helm:
        valueFiles:
          - $values/k8s/external-secrets/values.yaml
    - repoURL: https://github.com/Harsh-Upadhayay/homelab-k8s.git
      targetRevision: main
      ref: values # makes $values/... resolvable by the chart source above
    - repoURL: https://github.com/Harsh-Upadhayay/homelab-k8s.git
      targetRevision: main
      path: k8s/external-secrets/manifests # companion objects (4b: SecretStore, NetworkPolicy)
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # namespace.yaml is committed in manifests/
      - ServerSideApply=true # ESO CRDs exceed the 256KB client-side-apply ceiling (chart ships full OpenAPI schemas); SSA lets the apiserver apply them
