# Retained storage classes created during the Immich migration and now adopted
# by the Longhorn GitOps bundle. Retain protects the Longhorn volume if a PVC is
# deleted; PVC Prune=false annotations add a separate GitOps guardrail. The
# recovery-only node/disk selectors were removed after HDD convergence.
# Current volumes start with one data copy and can be promoted manually.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-immich-hdd-retain
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  backupBlockSize: "16777216"
  backupTargetName: default
  dataEngine: v1
  fsType: ext4
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-immich-db-retain
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  backupTargetName: default
  dataEngine: v1
  fsType: ext4
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
