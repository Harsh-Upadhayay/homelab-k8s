# Legacy StorageClass name retained because bound PVC storageClassName fields
# are immutable. The current homelab policy starts every volume with one data
# copy; selected Longhorn volumes can be promoted manually when wanted.
#
# Shape mirrors the chart's own generated StorageClass (helm template output),
# including volumeBindingMode: Immediate — unlike local-path, a Longhorn
# volume isn't pinned to whichever node the first pod lands on, so there's
# nothing to gain by waiting for the scheduler.
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-replicated
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fromBackup: ""
