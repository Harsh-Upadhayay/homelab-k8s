# Cluster Capacity dashboard — the "how much hardware is there" view.
#
# Hand-written and committed here rather than pulled from grafana.com by gnetId,
# because no upstream dashboard answers this question. kube-prometheus-stack's
# defaults and "Kubernetes / Views / Global" (15757) are built entirely from
# percentages, rates and counts — 30 panels, and not one absolute total. 15757
# has no storage panels at all. So "how many cores / how much RAM / how much
# disk does this cluster actually have" had nowhere to live.
#
# Loaded by the Grafana sidecar, which watches ConfigMaps labeled
# grafana_dashboard: "1" across ALL namespaces (verified against the running
# deployment: LABEL=grafana_dashboard, LABEL_VALUE=1, NAMESPACE=ALL). This is
# the second of the two mechanisms documented in values-kube-prometheus-stack.yaml
# — gnetId download for third-party dashboards, ConfigMap for ones we own.
#
# Reads only kube-state-metrics, node-exporter, cAdvisor and Longhorn — the
# sources the 2026-09-08 cardinality reduction deliberately left intact (its
# savings came from apiserver/etcd histogram buckets). So this cannot be broken
# by that work.
#
# Panel design: totals are magnitudes, not states, so they render as plain stat
# tiles in neutral ink with no threshold colouring. Utilisation IS a state, so
# those get gauges with the reserved status palette (green / yellow >=75% /
# red >=90%). Mixing the two — colouring a total red — would imply a judgement
# the number doesn't carry.
#
# The datasource is pinned by uid ("prometheus") rather than a $datasource
# template variable: this dashboard is ours and there is exactly one Prometheus,
# so the variable would add a resolution step that can silently fail.
#
# Verified before commit: all 15 panel queries returned real data against the
# live TSDB, and the JSON round-tripped through Grafana's own import API
# (18 panels in, 18 out, datasource resolved) rather than being trusted by eye.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster-capacity
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
