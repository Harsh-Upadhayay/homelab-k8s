# Grafana admin credentials — kube-prometheus-stack reads these via
# grafana.admin.existingSecret (see values-kube-prometheus-stack.yaml). ESO
# materializes this from SSM as the `grafana-admin-secret` Secret. Note Grafana
# itself runs anonymous-auth (the admin creds are a fallback, not the active
# login path) — see the values file's grafana.ini.auth.anonymous block.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
spec:
  refreshInterval: "0" # manual refresh only — annotate to force re-sync
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: grafana-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: /neovara/homeinfra/grafana/admin-password
    - secretKey: admin-user
      remoteRef:
        key: /neovara/homeinfra/grafana/admin-user
