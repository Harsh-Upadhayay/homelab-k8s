# kube-prometheus-stack Helm chart values. Chart version pinned at install
# time (ADR-0027 precedent — never ride a chart's latest):
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace --version 87.10.1 \
#     -f k8s/monitoring/values-kube-prometheus-stack.yaml
#
# Namespace: monitoring (upstream-conventional — same reasoning as ADR-0032:
# every dashboard/doc/example assumes this name).
#
# Storage: upstream ships NO persistence and NO resource requests by default
# for any of the three stateful pieces below (confirmed against the chart's
# own values.yaml) — an emptyDir TSDB loses all history on every pod
# restart. Explicit storageClassName per ADR-0031 (no cluster default to fall
# back on); tier is `longhorn` (1 copy, dev) not `longhorn-replicated` —
# metrics are inherently re-collected over time, so losing history to a
# worker failure is low-stakes, unlike real application data.

prometheus:
  prometheusSpec:
    # Chart default (serviceMonitorSelectorNilUsesHelmValues: true, etc.) is
    # NOT actually the "empty selector, watches everything" behavior an
    # earlier pass through this file assumed — left unset, the chart scopes
    # Prometheus to only its own ServiceMonitors (matchLabels: {release:
    # kube-prometheus-stack}). Confirmed live: Longhorn's and Traefik's own
    # bundled ServiceMonitors (issue #25) never appeared in Prometheus's
    # targets or even its generated scrape config until this was set to
    # false. This is what actually makes selectors empty ({}) and gives
    # cluster-wide auto-discovery of any ServiceMonitor/PodMonitor, from any
    # chart, with no additional per-install label needed.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Migrated to k3s-worker-3's HDD storage (longhorn-hdd storageClass) to
    # eliminate physical disk contention with etcd on pve-dell's USB SSD.
    # Control-plane VM migration (issue #49) no longer blocks monitoring restoration.
    replicas: 1
    # Extended from 15d to 30d, NOT 90d (2026-09-08, Task 2 of the
    # cardinality reduction — revised after final review). Measured on the
    # live cluster: prometheus_tsdb_storage_blocks_bytes = 16.72GiB on the
    # 20Gi PVC at 15d retention — already 84% full — which is 1.11GiB/day
    # at 335k series (16.72/15). 90d was rejected: even post-cut, 90 days of
    # new data alone is ~19.4GiB, and during the transition the existing
    # 16.72GiB of pre-cut high-cardinality blocks don't expire until they
    # age past 15d, so usage would peak near 36GiB on a 20Gi volume before
    # settling. A full Prometheus volume fails writes outright — TSDB has no
    # graceful eviction — so 30d is the safer step and can be revisited once
    # the cardinality cut's real per-day ingest is measured.
    #
    # retentionSize is a hard guard on top of the time-based retention:
    # whichever limit trips first wins, so no combination of series count
    # and time can overflow the volume. 14GiB is 70% of the 20Gi PVC,
    # leaving headroom for compaction (which needs roughly 2x the largest
    # block to run). Applying this will immediately prune the oldest
    # existing blocks to get back under 14GiB — that's intended, not a
    # bug: it reclaims the space the old, pre-cut high-cardinality data is
    # still holding.
    retention: 30d
    retentionSize: 14GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-hdd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              # Migrated from original longhorn storageClass to longhorn-hdd to
              # avoid physical disk contention with etcd on pve-dell's USB SSD.
              # Expanded from 10Gi (INC-2026-005) to 20Gi to provide headroom.
              storage: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 400Mi
      limits:
        # Bumped from 1Gi (2026-08-10): the WAL grew to 353 segments after
        # never successfully checkpointing, so post-replay TSDB compaction
        # pushed past 1Gi and got OOMKilled (exit 137) moments after
        # reaching /-/ready — a death spiral where each SIGKilled restart
        # left more mmap chunks corrupted and the next WAL replay bigger.
        #
        # Left at 2Gi, deliberately NOT lowered (2026-09-08, Task 2 of the
        # cardinality reduction — reverted after final review flagged a
        # 1Gi attempt here as unsafe). Metric relabelings only change what
        # gets scraped going forward; on the very first restart after this
        # change ships, Prometheus still has to replay the EXISTING WAL and
        # rebuild the current ~335k-series head before any cut takes
        # effect, which measured at ~1.0-1.7GiB — above a 1Gi ceiling. A
        # limit that tight would crash-loop the pod on that very restart,
        # before the cardinality cut it's supposed to validate ever runs. A
        # memory limit is also a ceiling, not a reservation: lowering it
        # frees no RAM on the node (requests stay 400Mi) — real RAM is
        # freed by the cardinality cut making Prometheus USE less, which
        # this limit does nothing to help or hinder. Any future resize of
        # this limit must be driven by a MEASURED post-cut steady-state
        # prometheus_tsdb_head_series, never a projection — sizing a limit
        # from a projection instead of a measurement is what caused the
        # 2026-08-10 incident above in the first place.
        memory: 2Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-hdd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi

grafana:
  # Pinned rather than left to the chart's default `<release>-grafana` name —
  # a known, stable Service name means ingressroute-grafana.yaml never needs
  # a post-install `kubectl get svc` lookup to fill in, on this cluster or a
  # rebuilt one.
  fullnameOverride: grafana
  # Admin credentials pinned to an externally-managed Secret instead of the
  # chart's default (a random password generated once, then left alone —
  # which ArgoCD and Helm each think they own, fighting every sync). Secret
  # created imperatively (`kubectl create secret`), never committed, per this
  # repo's secrets convention. Setting existingSecret makes the chart skip
  # rendering Secret/grafana entirely, so there's nothing left to drift.
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    # Grafana uses embedded SQLite, which cannot tolerate the write latency
    # of a cross-node HDD-backed Longhorn volume (SQLITE_BUSY lock timeouts
    # made every request take 15-80s, failing the /api/health readiness
    # probe). Only Prometheus's WAL replay/compaction caused the etcd disk
    # contention in INC-2026-003/005 — Grafana's small dataset never did, so
    # it stays on the standard SSD-backed longhorn storageClass.
    storageClassName: longhorn
    size: 2Gi
  # replicas: 1 (chart default) + an RWO Longhorn volume means the chart's
  # default RollingUpdate strategy deadlocks on any pod-spec change: k8s
  # schedules the new pod (possibly on another node) before killing the old
  # one, but the RWO volume can only attach to one node at a time, so the
  # new pod hangs forever in Init with a Multi-Attach error. Recreate kills
  # the old pod first, freeing the volume before the new one starts.
  deploymentStrategy:
    type: Recreate
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    # Bumped from 256Mi (2026-08-20): Grafana 13.1.0's unified-storage
    # backend builds and caches in-memory bleve search indexes (folders,
    # playlists, repositories) every ~10 minutes. Steady-state RSS grew
    # past 256Mi, so the pod ran ~1-2 days then got OOMKilled (exit 137),
    # visible beforehand as growing readiness/liveness probe timeouts —
    # same failure shape as the Prometheus OOM death spiral this file
    # already documents above.
    #
    # Left at 512Mi, not lowered (2026-09-08, Task 2 of the cardinality
    # reduction): defaultDashboardsEnabled: false, set further down in this
    # same grafana: block, removes ~28 dashboards from the bleve index that
    # this comment blames for the RSS growth above — but that's a
    # hypothesis about the mechanism, not yet a measurement of steady-state
    # RSS with them gone. Shaving this limit on that guess would repeat the
    # exact mistake being fixed elsewhere in this file: a limit sized to an
    # assumption about the working set, discovered wrong only via an
    # OOMKill or a slow thrash. Revisit once the pruned dashboard set has
    # actually run long enough to show real numbers.
    limits:
      memory: 512Mi
  # This platform never uses raw Ingress — every internal service gets a
  # hand-written IngressRoute instead (ingressroute-grafana.yaml), same as the
  # Longhorn UI (ADR-0033). Grafana's own Ingress support stays off.
  ingress:
    enabled: false
  # No auth, full stop — matches the Longhorn UI precedent (ADR-0033):
  # reachability via the Tailscale-only IngressRoute IS the authentication,
  # deliberately, not a gap. Unlike Longhorn this isn't "nothing to disable" —
  # Grafana's own login was a free extra layer being removed on purpose.
  # org_role: Admin means anyone who reaches grafana.in.neovara.uk gets full
  # admin (matching Longhorn's own no-auth blast radius), and
  # disable_login_form hides the login screen entirely rather than just
  # bypassing it silently.
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Admin
    auth:
      disable_login_form: true
  # Provisioned declaratively — no click-ops. kube-prometheus-stack already
  # provisions its own Prometheus datasource this exact way; this is the same
  # mechanism (Grafana's file-based datasource provisioning, just expressed
  # as chart values instead of a UI form) applied to Loki.
  additionalDataSources:
    - name: Loki
      type: loki
      # Pinned uid (default is Grafana-generated, e.g. P8E80F9AEF21F6940) so
      # the mixin dashboards below can substitute a known, stable value into
      # their {type, uid} datasource fields — see the loki/alloy dashboard
      # notes. The kube-prometheus-stack Prometheus datasource uses uid
      # "prometheus" the same way (its own provisioning ConfigMap).
      uid: loki
      access: proxy
      url: http://loki:3100 # the pinned Service name from values-loki.yaml
      isDefault: false
  # The chart bundles ~28 default dashboards (apiserver, scheduler,
  # controller-manager, etcd, proxy, nodes-aix, nodes-darwin,
  # k8s-resources-multicluster, and more) that all get loaded into
  # Grafana's unified-storage bleve search index alongside the platform
  # dashboards below — every loaded dashboard costs index memory whether
  # anyone opens it or not, which is exactly what the 512Mi limit comment
  # above is about. Turning it off removes that cost, and most of them
  # would render empty panels anyway: Task 1 (2026-09-08) stopped
  # collecting the apiserver/scheduler/controller-manager/etcd histogram
  # series they depend on, and this platform has neither a multi-cluster
  # setup nor non-Linux nodes for the rest to describe. The hand-picked
  # dashboards below (traefik, longhorn, argocd, tailscale, ...) are
  # unaffected — they come in through the separate file-based
  # dashboards:/dashboardProviders: mechanism just below, not this
  # chart-bundled default set.
  defaultDashboardsEnabled: false
  # Chart-native dashboard import: an init container curls each JSON straight
  # from grafana.com by gnetId/revision at pod start, so the platform commits
  # a version number instead of a copy-pasted dashboard export. Replaces the
  # old pattern (k8s/traefik/manifests/grafana-dashboard.yaml and
  # k8s/longhorn/manifests/grafana-dashboard.yaml — hand-exported JSON in a
  # ConfigMap labeled grafana_dashboard: "1", picked up by the sidecar). Both
  # mechanisms feed the same Grafana instance and can coexist, but there's no
  # reason to keep hand-copied JSON around once this is in place.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: platform
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/platform
  dashboards:
    platform:
      traefik:
        # https://grafana.com/grafana/dashboards/17347-traefik-official-kubernetes-dashboard/
        gnetId: 17347
        revision: 9
        datasource: Prometheus
      longhorn:
        # https://grafana.com/grafana/dashboards/17626
        gnetId: 17626
        revision: 1
        datasource: Prometheus
      argocd:
        # https://grafana.com/grafana/dashboards/14584-argocd/
        gnetId: 14584
        revision: 1
        datasource: Prometheus
      cert-manager:
        # https://grafana.com/grafana/dashboards/20850-cert-manager/
        # Newer dashboard schema (schemaVersion 39): datasource is a
        # {type, uid} object, not the flat string the four dashboards above
        # use — so the plain `datasource: Prometheus` mechanism (a blunt
        # `"datasource":.*,` -> literal-string replace, confirmed against
        # this chart's own download script) never matches it, and the *value*
        # has to be the datasource's real uid ("prometheus", lowercase — see
        # kube-prometheus-stack-grafana-datasource ConfigMap) rather than its
        # display name. List form does a plain `${name}` token replace
        # instead, wherever it appears in the raw JSON.
        gnetId: 20850
        revision: 1
        datasource:
          - name: datasource
            value: prometheus
      argo-rollouts:
        # Deliberately NOT grafana.com's "k8s-argo-rollout" (gnetId 15386,
        # top hit by name) — its panels query istio_requests_total /
        # istio_tcp_*_bytes_total, an Istio dashboard mislabeled with this
        # project's name, caught only by reading its raw JSON rather than
        # trusting the title. This is Argo Rollouts' own example dashboard
        # from its GitHub repo (the real upstream source, not on grafana.com
        # at all), pinned to the exact appVersion live (argo-rollouts
        # values.yaml, chart 2.41.0 -> appVersion v1.9.0) — old-style flat
        # `"datasource": "$datasource"` schema, same substitution mechanism
        # as traefik/longhorn/argocd above.
        url: https://raw.githubusercontent.com/argoproj/argo-rollouts/v1.9.0/examples/dashboard.json
        datasource: Prometheus
      loki:
        # grafana.com has no official Loki gnetId upload (the marketplace
        # results under "Loki" are all third-party log-viewer dashboards).
        # This is the real upstream source: the "Operational" dashboard from
        # Loki's own mixin, compiled and committed straight to the loki repo,
        # pinned to the exact appVersion live (values-loki.yaml, chart 7.0.0
        # -> appVersion 3.6.7). The two `datasource`-typed template variables
        # ($datasource, $loki_datasource) carry {type, uid} objects, so the
        # substituted `value` has to be each datasource's real UID
        # (lowercase "prometheus"; "loki" — the uid pinned on the Loki
        # datasource above), NOT its display name. An earlier pass used the
        # display names ("Prometheus"/"Loki") here and every panel read "No
        # data" — Grafana had no datasource with uid "Prometheus". Same
        # lesson as cert-manager/cloudflared.
        # ~15 of its 106 panels (percentile latency) depend on recording
        # rules this platform doesn't install (monitoring.rules in
        # values-loki.yaml stays off — that's alerting-policy scope, not
        # metrics-enablement) and will read "No data" until/unless added.
        url: https://raw.githubusercontent.com/grafana/loki/v3.6.7/production/loki-mixin-compiled/dashboards/loki-operational.json
        datasource:
          - name: datasource
            value: prometheus
          - name: loki_datasource
            value: loki
      alloy:
        # Same situation as Loki above: no grafana.com gnetId, real upstream
        # is the alloy-mixin compiled straight into grafana/alloy's own repo.
        # "Resources" (CPU/memory/component health) rather than "Cluster"
        # (alloy-cluster-overview.json) — this platform runs one Alloy
        # Deployment replica with clustering not configured, so there's no
        # cluster to overview. Pinned to the exact appVersion live
        # (values-alloy.yaml, chart 1.10.0 -> appVersion v1.17.0). Its
        # $datasource / $loki_datasource template variables carry {type, uid}
        # objects, so `value` must be the real lowercase UID ("prometheus";
        # "loki") not the display name — an earlier pass used "Prometheus"
        # here and every panel read "No data" (no datasource has uid
        # "Prometheus"). Same lesson as cert-manager/cloudflared/loki. The
        # "filters" ad-hoc variable is the one exception that stays broken:
        # it hardcodes uid "${datasource}" inside its own {type, uid} object
        # which the value-substitution doesn't reach — harmless, it's an
        # optional filter dropdown, not a data panel.
        url: https://raw.githubusercontent.com/grafana/alloy/v1.17.0/operations/alloy-mixin/rendered/dashboards/alloy-resources.json
        datasource:
          - name: datasource
            value: prometheus
          - name: loki_datasource
            value: loki
      cloudflared:
        # https://grafana.com/grafana/dashboards/24874-cloudflare-tunnel/
        # Newer {type, uid} schema like cert-manager above — value is the
        # real lowercase datasource uid, not the display name.
        gnetId: 24874
        revision: 4
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus
      tailscale:
        # https://grafana.com/grafana/dashboards/24178-tailscale-machine/
        # Feeds off the ProxyClass in k8s/tailscale/proxyclass-monitoring.yaml
        # — only the traefik-internal proxy is instrumented, so this dashboard
        # has a fleet of one. Its $cluster filter variable lists no options:
        # this single-cluster stack has no "cluster" label anywhere
        # (kube-prometheus-stack doesn't relabel one in — that's a Thanos /
        # Grafana Cloud remote-write convention, not a local one). The
        # dashboard filters with EXACT equality (cluster="$cluster"), not
        # regex — verified by reading its raw JSON, all 28 panels. That still
        # resolves: with no options the variable is empty, and PromQL
        # cluster="" matches series where the label is absent entirely, so
        # panels populate. Same {type, uid} schema as cert-manager/cloudflared.
        # CAVEAT: the ProxyClass metrics path is upstream-"unstable" (see
        # proxyclass-monitoring.yaml) and brand-new here, so confirm these
        # panels actually render after the first apply. If a variable
        # defaults to $__all instead of empty (a literal-string mismatch that
        # reads "No data"), the fix is a relabel_configs on the operator-
        # generated ServiceMonitor adding a cluster label — NOT a dashboard
        # swap.
        gnetId: 24178
        revision: 4
        datasource:
          - name: datasource
            value: prometheus
      node-exporter:
        # gnetId 1860 "Node Exporter Full" — the one dashboard that covers the
        # owner's actual ask: per-server CPU, memory, disk, network and connection
        # counts, over time. Node-exporter series are cheap and untouched by the
        # Task 1 cardinality cuts, so this keeps working long-term.
        gnetId: 1860
        revision: 37
        datasource:
          - name: datasource
            value: prometheus
      kubernetes-global:
        # https://grafana.com/grafana/dashboards/15757-kubernetes-views-global/
        # Restores the cluster-wide Kubernetes view that defaultDashboardsEnabled:
        # false removed. 1860 above covers the HOSTS (per-VM CPU/RAM/disk/net);
        # this covers the CLUSTER (node count, running pods, request-vs-capacity
        # commitment, aggregate container CPU/RAM, pod restarts) — the "is the
        # cluster healthy as a whole" question that had no home after the
        # cardinality reduction.
        #
        # Chosen because it reads only kube-state-metrics, node-exporter and
        # cAdvisor — all deliberately left intact by the cardinality cuts, whose
        # savings came from apiserver/etcd histogram buckets, not from these.
        # So this dashboard cannot be broken by that work, now or later.
        #
        # $cluster caveat, same class as the tailscale entry above and verified
        # the same way (reading the raw JSON, not guessing): all 73 queries
        # filter with EXACT equality cluster="$cluster", and the variable is
        # populated by label_values(kube_node_info, cluster) with
        # includeAll: false. This stack sets no cluster label on kube_node_info
        # (the only `cluster` label anywhere belongs to Loki's own metrics), so
        # the variable resolves empty and the filters become cluster="", which
        # in PromQL matches series where the label is absent — the panels
        # populate. Confirmed against the live TSDB on 2026-09-08: 10 of 10
        # representative panel queries returned real values (nodes=3,
        # running pods=106, RAM utilisation=41%, disk=31%). If a future change
        # ever DOES introduce a real cluster label, these panels go blank until
        # the variable is repointed — that would be the fix, not a dashboard swap.
        #
        # Note the input name here is DS_PROMETHEUS (this dashboard's __inputs),
        # matching cloudflared/cert-manager above — not the bare `datasource`
        # shape used by tailscale and node-exporter.
        gnetId: 15757
        revision: 43
        datasource:
          - name: DS_PROMETHEUS
            value: prometheus

kubeStateMetrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi

# A blanket ".*_bucket" drop (this branch's original approach) was reverted
# after final review (2026-09-08): it silently killed
# KubeClientCertificateExpiration (warning + critical), which reads
# apiserver_client_certificate_expiration_seconds_bucket — a low-cardinality
# histogram and a genuinely important k3s alert — along with
# kubelet_pleg_relist_duration_seconds_bucket. A blanket regex can't tell a
# 335k-series histogram from a 10-series one; it only knows "_bucket". This
# is a named deny-list of the MEASURED expensive histograms instead: only
# what's named here is dropped, everything else (including any new
# histogram this platform later starts scraping) survives by default. It's
# also the far easier thing for the repo owner to audit — a wildcard grows
# invisibly, a name list doesn't. Applied identically to kubeApiServer,
# kubelet, and kubeEtcd below (each job's own copy of these histograms).
# The blanket ".*_bucket" drop is kept ONLY inside kubelet's
# cAdvisorMetricRelabelings further down — cAdvisor exposes no alert-bearing
# histograms, so there's nothing there for a wildcard to accidentally kill.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "(apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_request_body_size_bytes|apiserver_watch_list_duration_seconds|apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes|apiserver_admission_controller_admission_duration_seconds|apiserver_flowcontrol_request_execution_seconds|etcd_request_duration_seconds|workqueue_work_duration_seconds|workqueue_queue_duration_seconds|rest_client_request_duration_seconds|scheduler_plugin_execution_duration_seconds|scheduler_event_handling_duration_seconds|kubelet_runtime_operations_duration_seconds|storage_operation_duration_seconds|prober_probe_duration_seconds|longhorn_rest_client_rate_limiter_latency_seconds|longhorn_rest_client_request_latency_seconds|longhorn_workqueue_work_duration_seconds|longhorn_workqueue_queue_duration_seconds)_bucket"

# kubelet/cAdvisor is the largest remaining scrape job (92,626 series
# measured on this cluster) even after the control-plane duplication and
# _bucket histograms above are dropped. Keep per-container CPU/memory/
# network/filesystem series — what this platform's dashboards and alerts
# actually read — and drop everything else cAdvisor exposes by default:
# cgroup accounting detail (tasks_state, threads, ulimits, sockets,
# processes, file descriptors), start-time/last-seen bookkeeping
# (container_start_time_seconds, container_last_seen), per-device
# blkio/memory-failure counters, and spec_* metadata labels. None of it
# backs a panel or alert here.
kubelet:
  serviceMonitor:
    # cAdvisorMetricRelabelings below restates the chart's OWN default list
    # (kube-prometheus-stack 87.10.1 values.yaml) verbatim before appending
    # this platform's rules, because Helm REPLACES a list value, it doesn't
    # merge it — an earlier pass on this branch set this key to only this
    # platform's own two rules, which silently deleted all of the chart's
    # defaults. The worst loss was `sourceLabels: [id, pod], regex: '.+;'`,
    # which drops every cgroup with no pod label (system.slice, the
    # kubepods parent cgroup, ...) — losing it adds back tens of thousands
    # of series and would have invalidated this whole cardinality estimate.
    # Anything under "chart default:" below must be kept in sync with
    # upstream if the chart version in the install command at the top of
    # this file is ever bumped.
    cAdvisorMetricRelabelings:
      # --- chart default (kube-prometheus-stack 87.10.1 values.yaml), copied verbatim ---
      # Drop less useful container CPU metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'
      # Drop less useful container / always zero filesystem metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
      # Drop less useful / always zero container memory metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_memory_(mapped_file|swap)'
      # Drop less useful container process metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_(file_descriptors|tasks_state|threads_max)'
      # Drop container_memory_failures_total{scope="hierarchy"} metrics,
      # we only need the container scope.
      - sourceLabels: [__name__, scope]
        action: drop
        regex: 'container_memory_failures_total;hierarchy'
      # Drop container_network_... metrics that match various interfaces that
      # correspond to CNI and similar interfaces. This avoids capturing network
      # metrics for host network containers.
      - sourceLabels: [__name__, interface]
        action: drop
        regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
      # Drop container spec metrics that overlap with kube-state-metrics.
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_spec.*'
      # Drop cgroup metrics with no pod.
      - sourceLabels: [id, pod]
        action: drop
        regex: '.+;'
      # --- this platform's own additions, appended after the chart defaults above ---
      - action: drop
        sourceLabels: [__name__]
        regex: "container_(tasks_state|memory_failures_total|blkio_device_usage_total|memory_(mapped_file|swap|failcnt)|file_descriptors|threads.*|ulimits_soft|sockets|processes|last_seen|start_time_seconds|spec_.*)"
      - action: drop
        sourceLabels: [__name__]
        regex: ".*_bucket"
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "(apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_request_body_size_bytes|apiserver_watch_list_duration_seconds|apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes|apiserver_admission_controller_admission_duration_seconds|apiserver_flowcontrol_request_execution_seconds|etcd_request_duration_seconds|workqueue_work_duration_seconds|workqueue_queue_duration_seconds|rest_client_request_duration_seconds|scheduler_plugin_execution_duration_seconds|scheduler_event_handling_duration_seconds|kubelet_runtime_operations_duration_seconds|storage_operation_duration_seconds|prober_probe_duration_seconds|longhorn_rest_client_rate_limiter_latency_seconds|longhorn_rest_client_request_latency_seconds|longhorn_workqueue_work_duration_seconds|longhorn_workqueue_queue_duration_seconds)_bucket"

# k3s runs kube-scheduler/kube-controller-manager/etcd inside its own single
# binary, not as pods — so the chart's default Service selectors
# (component: kube-scheduler, etc.) never match anything (issue #25). These
# endpoints tell the chart's own Services to point at the real node IP
# instead of discovering pods, once k3s_server's Ansible role (see
# kube-controller-manager-arg/kube-scheduler-arg/etcd-expose-metrics in
# config.yaml.j2) has opened each component's metrics listener beyond
# 127.0.0.1. Single-server cluster today (ADR-0008) — one IP is the whole
# list; a future HA control plane would add its other members here too.
#
# kubeControllerManager/kubeScheduler are disabled (2026-09-08): issue #25's
# endpoint work above was correct at the time, but it was scraping a second
# copy of the same data — k3s runs apiserver/scheduler/controller-manager in
# a single process sharing one metrics registry, so :10257 and :10259
# re-serve the same apiserver_*/etcd_* series already scraped once from
# :6443, measured at 138,933 duplicate series (41% of the whole database)
# for zero extra information. endpoints/serviceMonitor below are kept, not
# deleted: a future non-k3s or HA control plane runs these as genuinely
# separate processes with their own registries and would need `enabled`
# flipped back to true rather than this config re-authored from scratch.
# kubeEtcd stays enabled below — :2381 is a genuinely separate listener,
# not a re-export of :6443.
kubeControllerManager:
  enabled: false
  endpoints:
    - 192.168.1.21
  serviceMonitor:
    # Self-signed cert from k3s's internal CA, not a publicly-trusted one —
    # same trust boundary as every other in-cluster TLS hop on this platform.
    insecureSkipVerify: true

# Disabled for the same reason as kubeControllerManager immediately above —
# see that block's comment (k3s serves scheduler/controller-manager/
# apiserver metrics off one shared registry, so this would just be a
# second copy of series already scraped via :6443). Do not re-enable this
# blind just because it's grep-able on its own; the duplication argument
# lives on kubeControllerManager, not here.
kubeScheduler:
  enabled: false
  endpoints:
    - 192.168.1.21
  serviceMonitor:
    insecureSkipVerify: true

kubeEtcd:
  endpoints:
    - 192.168.1.21
  # No serviceMonitor.scheme/insecureSkipVerify override needed here — etcd's
  # --etcd-expose-metrics listener is plain HTTP by design (a separate,
  # unauthenticated metrics-only port, not the mTLS client/peer ports).
  serviceMonitor:
    # Same named-deny-list reasoning as kubeApiServer above (see that
    # comment) — etcd's own request-duration histogram is in the list, but
    # a blanket ".*_bucket" drop was reverted because it also killed
    # low-cardinality, alert-bearing histograms elsewhere in this file.
    metricRelabelings:
      - action: drop
        sourceLabels: [__name__]
        regex: "(apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_request_body_size_bytes|apiserver_watch_list_duration_seconds|apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes|apiserver_admission_controller_admission_duration_seconds|apiserver_flowcontrol_request_execution_seconds|etcd_request_duration_seconds|workqueue_work_duration_seconds|workqueue_queue_duration_seconds|rest_client_request_duration_seconds|scheduler_plugin_execution_duration_seconds|scheduler_event_handling_duration_seconds|kubelet_runtime_operations_duration_seconds|storage_operation_duration_seconds|prober_probe_duration_seconds|longhorn_rest_client_rate_limiter_latency_seconds|longhorn_rest_client_request_latency_seconds|longhorn_workqueue_work_duration_seconds|longhorn_workqueue_queue_duration_seconds)_bucket"

# Each rule group below evaluates against series removed above and would
# otherwise fail silently rather than loudly: alerts using
# histogram_quantile() over now-dropped _bucket series simply never fire,
# and recording rules for the now-disabled kubeControllerManager/
# kubeScheduler scrape jobs evaluate against nothing. Disabled here for the
# same reason in each case — their input series are no longer collected.
# kubernetesSystem and kubelet are deliberately NOT in this list: I1's named
# deny-list (replacing the earlier blanket ".*_bucket" drop) keeps their
# input series, so those two groups stay enabled (chart default) and firing.
# What each disabled group lost, specifically:
#   - kubeApiserverBurnrate / kubeApiserverHistogram / kubeApiserverSlos:
#     apiserver_request_duration_seconds_bucket — named in the kubeApiServer
#     deny-list above precisely because it's the measured high-cardinality
#     one; still gone even with the blanket drop removed.
#   - kubeApiserverAvailability: apiserver_request_sli_duration_seconds_bucket
#     — also named in that same deny-list, same reasoning. Added here
#     (2026-09-08, final review) because leaving this rule group enabled
#     against a deny-listed input is exactly the silent-failure mode this
#     comment already warns about for the other groups.
#   - kubeControllerManager: the whole kubeControllerManager scrape job is
#     `enabled: false` above (duplicate registry) — no series at all.
#   - kubeSchedulerAlerting / kubeSchedulerRecording: same, for the disabled
#     kubeScheduler scrape job.
#   - etcd: etcd_request_duration_seconds_bucket — also named in the
#     kubeEtcd deny-list above (the etcd scrape job itself stays enabled;
#     only this specific histogram is dropped).
defaultRules:
  rules:
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    etcd: false
